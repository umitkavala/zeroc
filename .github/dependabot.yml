version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/implementations/python"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"

  # JavaScript dependencies
  - package-ecosystem: "npm"
    directory: "/implementations/javascript"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Go dependencies
  - package-ecosystem: "gomod"
    directory: "/implementations/go"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      include: "scope"
