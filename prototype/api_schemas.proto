syntax = "proto3";

package api;

message ShippingAddress {
  string street = 1;
  string city = 2;
  string postal_code = 3;
  string country = 4;
}

message OrderItem {
  int32 product_id = 1;
  int32 quantity = 2;
  double price = 3;
}

message Order {
  string order_id = 1;
  int32 user_id = 2;
  int64 timestamp = 3;
  repeated OrderItem items = 4;
  ShippingAddress shipping_address = 5;
  string payment_method = 6;
  double total_amount = 7;
}

message ProductView {
  int32 user_id = 1;
  int32 product_id = 2;
  int64 timestamp = 3;
  string referrer = 4;
  string device_type = 5;
}

message SearchRequest {
  int32 user_id = 1;
  string query = 2;
  int64 timestamp = 3;
  int32 page = 4;
  int32 limit = 5;
  repeated string filters = 6;
}
